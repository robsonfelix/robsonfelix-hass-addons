configuration:
  enable_mcp:
    name: Habilitar MCP do Home Assistant
    description: >-
      Habilita o servidor MCP do Home Assistant para interação direta com
      entidades e serviços pelo Claude Code. Permite que o Claude consulte
      estados, chame serviços e interaja com sua casa inteligente.
  enable_playwright_mcp:
    name: Habilitar MCP Playwright
    description: >-
      Habilita o servidor MCP Playwright para automação de navegador. Requer o
      add-on "Playwright Browser" instalado e em execução. Permite que o Claude
      navegue em páginas web, preencha formulários, clique em elementos e tire
      screenshots.
  playwright_cdp_host:
    name: Host CDP do Playwright
    description: >-
      Nome do host do add-on Playwright Browser para conexão CDP. Deixe vazio
      para o padrão (playwright-browser). Se a conexão falhar, verifique o
      nome do host do container Playwright Browser (ex: 1016f397-playwright-browser).
  terminal_font_size:
    name: Tamanho da Fonte do Terminal
    description: >-
      Tamanho da fonte do terminal web em pixels (10-24).
      Ajuste para melhor legibilidade no seu monitor.
  terminal_theme:
    name: Tema do Terminal
    description: >-
      Tema de cores do terminal web.
      Escolha 'dark' para fundo escuro ou 'light' para fundo claro.
  working_directory:
    name: Diretório de Trabalho
    description: >-
      O diretório padrão quando o Claude Code inicia.
      Use /homeassistant para acesso direto aos arquivos de configuração do HA.
  session_persistence:
    name: Persistência de Sessão
    description: >-
      Habilita persistência de sessão via tmux. Quando habilitado, sua sessão
      do terminal sobrevive a atualizações do navegador e desconexões.
      Recomendado para tarefas de longa duração.
  auto_update_claude:
    name: Atualização Automática do Claude Code
    description: >-
      Verifica e instala automaticamente atualizações do Claude Code ao iniciar o add-on.
      Mantém o Claude Code atualizado sem precisar atualizar a versão do add-on.
  auto_launch_claude:
    name: Início Automático do Claude Code
    description: >-
      Inicia o Claude Code automaticamente quando o terminal web é aberto. "off"
      abre um shell comum (padrão), "new" inicia uma nova sessão do Claude Code,
      "continue" retoma a sessão mais recente (claude --continue). Ao sair do
      Claude Code você fica em um shell normal.
  enable_remote_control:
    name: Habilitar Controle Remoto
    description: >-
      Inicia automaticamente o Claude Code com Controle Remoto habilitado em cada sessão.
      Permite visualizar e controlar sua sessão local do Claude Code pelo claude.ai/code
      ou pelo aplicativo móvel do Claude. Requer assinatura claude.ai Pro, Max, Team ou
      Enterprise (chaves de API não são suportadas). Nota de segurança: este add-on é
      executado como root com acesso total ao seu servidor Home Assistant, então qualquer
      pessoa que consiga entrar na conta Claude vinculada poderá controlá-lo. Mantenha
      desativado a menos que precise.
  remote_control_session_prefix:
    name: Prefixo do Nome da Sessão de Controle Remoto
    description: >-
      Prefixo para nomes de sessão de Controle Remoto gerados automaticamente, visível
      no claude.ai/code e no aplicativo móvel do Claude. O padrão é "HomeAssistant",
      gerando nomes como "HomeAssistant-graceful-unicorn". Aplicável apenas quando o Controle Remoto está habilitado.
  extra_npm_packages:
    name: Pacotes npm Adicionais
    description: >-
      Especificações de pacotes npm (ex.: "@modelcontextprotocol/server-filesystem"
      ou "some-mcp@1.4.2") instaladas em cada inicialização do add-on em um diretório
      persistente no volume do HA, sobrevivendo a atualizações e reconstruções do
      add-on. Use para adicionar servidores MCP personalizados sem fazer fork do
      add-on.
  remote_control_server:
    name: Servidor de Controle Remoto
    description: >-
      Inicia um servidor de Controle Remoto do Claude Code em segundo plano quando o
      add-on inicia, sem abrir o terminal web. Pelo claude.ai/code ou pelo aplicativo
      móvel do Claude você pode iniciar novas sessões que rodam em /homeassistant, não
      apenas controlar uma existente. Reinicia automaticamente se encerrar; veja com
      "tmux attach -t rc". Requer Habilitar Controle Remoto. Nota de segurança:
      qualquer pessoa que consiga entrar na conta Claude vinculada poderá iniciar
      novas sessões como root no seu servidor Home Assistant.
  remote_control_permission_mode:
    name: Modo de Permissão do Controle Remoto
    description: >-
      Modo de permissão para sessões iniciadas pelo servidor de Controle Remoto.
      "default" pede aprovação das ações pelo aplicativo; "acceptEdits" aprova edições
      de arquivos; "auto" deixa o Claude decidir quais ações são seguras; "plan" apenas
      planeja; "dontAsk" nega tudo que não foi pré-aprovado. Aplicável apenas quando o
      Servidor de Controle Remoto está habilitado.

network:
  7681/tcp: Terminal Web (ttyd)
  default_task_model:
    name: Modelo padrao da tarefa
    description: >-
      Modelo usado pelas execucoes headless disparadas por automacoes quando a
      tarefa nao especifica um. Deixe vazio para usar o padrao do Claude Code.
  default_task_allowed_tools:
    name: Ferramentas permitidas por padrao nas tarefas
    description: >-
      Permissoes de ferramentas concedidas as execucoes headless quando a
      tarefa nao traz a propria lista. Execucoes headless nao conseguem
      responder a pedidos de permissao, entao tudo que nao estiver permitido
      aqui (ou na tarefa) e negado.
  task_max_runtime_minutes:
    name: Tempo maximo de execucao (minutos)
    description: Execucoes headless sao encerradas apos esse numero de minutos.

name: Playwright Browser
description: Headless Chromium browser with CDP endpoint for browser automation
version: "0.1.13"
slug: playwright-browser
image: ghcr.io/robsonfelix/playwright-browser-{arch}
url: https://github.com/robsonfelix/robsonfelix-hass-addons
arch:
  - amd64
  - aarch64
boot: manual
init: false
panel_icon: mdi:google-chrome
panel_title: Playwright Browser
options:
  cdp_port: 9222
schema:
  cdp_port: port
ports:
  9222/tcp: null
ports_description:
  9222/tcp: Chrome DevTools Protocol (CDP) endpoint

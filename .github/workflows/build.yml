name: Build

# Em PR: constroi sem publicar, pegando erro de build cedo.
# Em tag v*: constroi e publica em ghcr.io.
#
# Motivo de existir: ate 11/2026 nada construia o add-on automaticamente. Onze
# PRs ficaram tres meses em conflito sem ninguem saber, e a issue #54 (gate de
# AVX quebrado em ARM) chegou a producao porque nenhuma arquitetura alem de
# amd64 era testavel por quem revisava.
on:
  pull_request:
  push:
    branches: [main]
    # Monorepo: a tag diz QUAL add-on lancar. 'claudecode/v1.2.76',
    # 'playwright-browser/v0.1.13'. O formato antigo 'v1.2.x' era da
    # claudecode por convencao implicita e continua aceito.
    tags: ['*/v*', 'v*']

jobs:
  # Descobre qual add-on construir. Numa tag vem do proprio nome dela; fora de
  # tag so a claudecode e construida, porque e a que muda e porque a imagem
  # base do playwright-browser tem ~2GB e nao vale baixar em todo PR.
  target:
    runs-on: ubuntu-latest
    outputs:
      addon: ${{ steps.pick.outputs.addon }}
    steps:
      - id: pick
        run: |
          REF='${{ github.ref_name }}'
          case "$REF" in
            */v*) ADDON="${REF%%/v*}" ;;
            *)    ADDON=claudecode ;;
          esac
          echo "addon=$ADDON" >> "$GITHUB_OUTPUT"
          echo "Building: $ADDON"

  build:
    needs: target
    name: ${{ needs.target.outputs.addon }} (${{ matrix.arch }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # armv7, armhf e i386 foram removidos em 1.2.76: sem suporte no
        # Home Assistant desde 2025.12. Sobram as duas arquiteturas reais.
        arch: [amd64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        if: github.ref_type == 'tag'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --test constroi sem publicar. Nas tags ele sai e a imagem vai para o
      # ghcr, para o usuario baixar em vez de compilar na propria maquina --
      # o que hoje faz cada instalacao rodar o estagio de build do ttyd.
      # ARMADILHA, verificada 2026-11-01: esta action usa o PROPRIO ref do
      # `uses:` como tag da imagem Docker do builder --
      #   docker pull ghcr.io/home-assistant/${arch}-builder:${ref}
      # Entao so da para pinar num ref que TENHA imagem publicada. Pinar numa
      # release qualquer quebra: 2026.09.0 e 2026.06.0 nao tem imagem, e o
      # build morre com "not found" antes de comecar.
      #
      # Checado no ghcr: das releases recentes, so 2026.03.2 tem imagem, nas
      # duas arquiteturas. O @master anterior caia no fallback interno da
      # action para a imagem 2026.02.1 -- ou seja, este pin tambem ATUALIZA o
      # builder, alem de torna-lo imutavel.
      #
      # Antes de trocar este SHA, confirme que a imagem existe:
      #   ghcr.io/home-assistant/amd64-builder:<sha>
      #   ghcr.io/home-assistant/aarch64-builder:<sha>
      - name: Build add-on
        uses: home-assistant/builder@62a1597b84b3461abad9816d9cd92862a2b542c3  # 2026.03.2
        with:
          args: |
            ${{ github.ref_type == 'tag' && ' ' || '--test' }} \
            --${{ matrix.arch }} \
            --target ${{ needs.target.outputs.addon }} \
            --image ${{ needs.target.outputs.addon }}-{arch} \
            --docker-hub ghcr.io/${{ github.repository_owner }} \
            --addon

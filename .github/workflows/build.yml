name: Build

# On a PR: builds without publishing, catching build errors early.
# On a v* tag: builds and publishes to ghcr.io.
#
# Why this exists: until 11/2026 nothing built the add-on automatically. Eleven
# PRs sat conflicting for three months without anyone knowing, and issue #54
# (the AVX gate broken on ARM) reached production because no architecture other
# than amd64 was testable by whoever reviewed.
on:
  pull_request:
  push:
    branches: [main]
    # Monorepo: the tag says WHICH add-on to release. 'claudecode/v1.2.76',
    # 'playwright-browser/v0.1.13'. The older 'v1.2.x' form meant claudecode by
    # implicit convention and is still accepted.
    tags: ['*/v*', 'v*']

jobs:
  # Works out which add-on to build. On a tag it comes from the tag name;
  # otherwise only claudecode is built, because it is the one that changes and
  # because playwright-browser's base image is ~2GB, not worth pulling on
  # every PR.
  target:
    runs-on: ubuntu-latest
    outputs:
      addon: ${{ steps.pick.outputs.addon }}
    steps:
      - id: pick
        run: |
          REF='${{ github.ref_name }}'
          case "$REF" in
            */v*) ADDON="${REF%%/v*}" ;;
            *)    ADDON=claudecode ;;
          esac
          echo "addon=$ADDON" >> "$GITHUB_OUTPUT"
          echo "Building: $ADDON"

  build:
    needs: target
    name: ${{ needs.target.outputs.addon }} (${{ matrix.arch }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # armv7, armhf and i386 were dropped in 1.2.76: unsupported by Home
        # Assistant since 2025.12. These two are what is left.
        arch: [amd64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        if: github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # TRAP, verified 2026-11-01: this action uses the ref from its own
      # `uses:` line as the tag of the builder Docker image it pulls --
      #   docker pull ghcr.io/home-assistant/${arch}-builder:${ref}
      # So a ref is only pinnable if an image was published for it. Pinning to
      # an arbitrary release breaks: 2026.09.0 and 2026.06.0 have no image and
      # the build dies with "not found" before it starts.
      #
      # Checked against ghcr: of the recent releases only 2026.03.2 has images,
      # for both architectures. The previous @master fell back internally to
      # the 2026.02.1 image, so this pin also UPGRADES the builder as well as
      # making it immutable.
      #
      # Before changing this SHA, confirm the image exists:
      #   ghcr.io/home-assistant/amd64-builder:<sha>
      #   ghcr.io/home-assistant/aarch64-builder:<sha>
      - name: Build add-on
        uses: home-assistant/builder@7412f0023ea9b6e58e8bb5059f1660f51376f49a  # 2026.09.0
        with:
          args: |
            ${{ github.ref_type == 'tag' && ' ' || '--test' }} \
            --${{ matrix.arch }} \
            --target ${{ needs.target.outputs.addon }} \
            --image ${{ needs.target.outputs.addon }}-{arch} \
            --docker-hub ghcr.io/${{ github.repository_owner }} \
            --addon

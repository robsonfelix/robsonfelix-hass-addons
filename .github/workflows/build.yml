name: Build

# Em PR: constroi amd64 e aarch64 sem publicar -- cobre as duas arquiteturas
# que concentram os usuarios e pega erro de build cedo.
# Em tag v*: constroi as cinco e publica em ghcr.io.
#
# Motivo de existir: ate 11/2026 nada construia o add-on automaticamente. Onze
# PRs ficaram tres meses em conflito sem ninguem saber, e a issue #54 (gate de
# AVX quebrado em ARM) chegou a producao porque nenhuma arquitetura alem de
# amd64 era testavel por quem revisava.
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(github.ref_type == 'tag'
          && '["amd64","aarch64","armv7","armhf","i386"]'
          || '["amd64","aarch64"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        if: github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --test constroi sem publicar. Nas tags ele sai e a imagem vai para o
      # ghcr, para o usuario baixar em vez de compilar na propria maquina --
      # o que hoje faz cada instalacao rodar o estagio de build do ttyd.
      - name: Build add-on
        uses: home-assistant/builder@master
        with:
          args: |
            ${{ github.ref_type == 'tag' && ' ' || '--test' }} \
            --${{ matrix.arch }} \
            --target claudecode \
            --image claudecode-{arch} \
            --docker-hub ghcr.io/${{ github.repository_owner }} \
            --addon
